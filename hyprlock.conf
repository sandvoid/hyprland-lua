general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 5
}

input-field {
    monitor =
    size = 250, 40
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgba(ffffffaa)
    inner_color = rgba(00000080)
    font_color = rgb(ffffff)

    fade_on_empty = false
    placeholder_text = <i>Password daaliye........</i>

    position = 0, 0
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%I:%M %p')"
    color = rgb(ffffff)
    font_size = 48
    font_family = Monospace
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %d %B')"
    color = rgba(ffffffcc)
    font_size = 18
    font_family = Monospace
    position = 0, 50
    halign = center
    valign = center
}

